<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a3d62">
<title>Acesso</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; background: #111; }
body:not(.pronto) .tela { opacity: 0 !important; }
.titulo-acesso { font-size: 1.35rem; font-weight: 700; text-align: center; margin-bottom: 26px; max-width: 92%; }
.tela { position: fixed; inset: 0; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; }
/* troca de telas é um corte limpo (sem crossfade) para não haver sobreposição */
.tela.oculto { display: none; }
.oculto { opacity: 0; }
.oculto, .oculto * { pointer-events: none !important; }
img.conf { object-fit: contain; display: block; }
.logo-img { max-width: 62%; max-height: 42vh; }
.topo-img { max-width: 55%; max-height: 26vh; margin-bottom: 40px; }
.cont-img { max-width: 58%; max-height: 24vh; margin-bottom: 22px; }
.cont-gif { max-width: 50%; max-height: 24vh; margin-top: 8px; }
.ph { display: grid; place-items: center; border-radius: 16px; background: #e6e6e6; color: #666; border: 2px dashed #bbb; font-weight: 700; letter-spacing: 1px; }
.ph.logo-img { width: 200px; height: 200px; } .ph.topo-img { width: 150px; height: 150px; }
.ph.cont-img { width: 150px; height: 120px; } .ph.cont-gif { width: 120px; height: 120px; }
.bolinhas { display: flex; gap: 16px; margin-bottom: 42px; }
.bolinha { width: 20px; height: 20px; border-radius: 50%; background: var(--bolinha); border: 2px solid rgba(0,0,0,.12); transition: transform .12s ease, background .12s ease; cursor: pointer; }
.bolinha.on { background: var(--bolinha-on); transform: scale(1.08); }
.mat-input { position: absolute; opacity: 0; width: 1px; height: 1px; border: 0; padding: 0; font-size: 16px; pointer-events: none; }
.btn-confirmar { min-width: 200px; padding: 15px 34px; border: 0; border-radius: 12px; font-family: inherit; font-size: 1.05rem; font-weight: 700; cursor: pointer; background: var(--btn); color: var(--btn-txt); opacity: .45; pointer-events: none; transition: opacity .2s ease, transform .1s ease; }
.btn-confirmar.ativo { opacity: 1; pointer-events: auto; } .btn-confirmar.ativo:active { transform: scale(.97); }
.dica { margin-top: 22px; font-size: .82rem; color: var(--dica); }
.cont h1 { font-size: 1.5rem; margin-bottom: 10px; text-align: center; }
.cont p { font-size: 1.02rem; text-align: center; margin-bottom: 6px; max-width: 92%; line-height: 1.5; }
</style>
</head>
<body>
  <script>try{var c=localStorage.getItem("cfg_splash_cor");if(c)document.body.style.background=c;}catch(e){}</script>

  <div class="tela" id="tela1"><img class="conf logo-img" id="splash-logo" alt="logo"></div>

  <!-- TELA DE ACESSO 1 -->
  <div class="tela oculto" id="tela-acesso">
    <img class="conf topo-img" data-el="img" alt="">
    <h1 class="titulo-acesso" data-el="titulo"></h1>
    <div class="bolinhas" data-el="bolinhas"></div>
    <input class="mat-input" type="tel" inputmode="numeric" autocomplete="off" data-el="input">
    <button class="btn-confirmar" type="button" data-el="btn">Confirmar</button>
    <div class="dica" data-el="dica"></div>
  </div>

  <!-- TELA DE ACESSO 2 (configuração própria) -->
  <div class="tela oculto" id="tela-acesso2">
    <img class="conf topo-img" data-el="img" alt="">
    <h1 class="titulo-acesso" data-el="titulo"></h1>
    <div class="bolinhas" data-el="bolinhas"></div>
    <input class="mat-input" type="tel" inputmode="numeric" autocomplete="off" data-el="input">
    <button class="btn-confirmar" type="button" data-el="btn">Confirmar</button>
    <div class="dica" data-el="dica"></div>
  </div>

  <div class="tela oculto cont" id="tela-gif">
    <img class="conf cont-img" id="gif-img" alt=""><h1 id="gif-titulo"></h1><p id="gif-texto"></p><img class="conf cont-gif" id="gif-anim" alt="">
  </div>
  <div class="tela oculto cont" id="tela-final">
    <img class="conf cont-img" id="fim-img" alt=""><h1 id="fim-titulo"></h1><p id="fim-texto"></p><img class="conf cont-gif" id="fim-anim" alt="">
  </div>

<script>
const ACESSO_PADRAO = { cor:"#0a3d62", imagem:"", digitos:6, titulo:"Informe sua matrícula", corTitulo:"#ffffff", corBolinha:"#ffffff", corBolinhaPreenchida:"#000000", textoBotao:"Confirmar", corBotao:"#ffffff", corTextoBotao:"#0a3d62", textoDica:"Toque para digitar sua matrícula", corDica:"rgba(255,255,255,.75)", mostrarDica:true };
const DEFAULT = {
  splash: { cor:"#0a3d62", logo:"", duracao:3000 },
  acesso: Object.assign({}, ACESSO_PADRAO, { pedirSegunda:true }),
  acesso2: Object.assign({}, ACESSO_PADRAO, { titulo:"Informe a segunda matrícula" }),
  telaGif: { cor:"#0a3d62", imagem:"", titulo:"Aguarde um instante", texto:"Estamos preparando a próxima etapa.", gif:"", corTitulo:"#ffffff", corTexto:"rgba(255,255,255,.9)", duracao:5000 },
  telaFinal: { cor:"#0a3d62", imagem:"", titulo:"Tudo certo!", texto:"Suas matrículas foram registradas.", gif:"", corTitulo:"#ffffff", corTexto:"rgba(255,255,255,.9)" }
};

function iniciar(CONFIG) {
  const $ = (id) => document.getElementById(id);

  function aplicarImagem(el, url, classe, rot) {
    if (!el) return;
    if (url) { el.src = url; el.onerror = () => trocarPh(el, classe, rot); }
    else trocarPh(el, classe, rot);
  }
  function trocarPh(el, classe, rot) { const d = document.createElement("div"); d.className = "ph " + classe; d.textContent = rot; if (el.parentNode) el.parentNode.replaceChild(d, el); }

  // fundos e telas de conteúdo
  $("tela1").style.background = CONFIG.splash.cor;
  $("tela-gif").style.background = CONFIG.telaGif.cor;
  $("tela-final").style.background = CONFIG.telaFinal.cor;
  aplicarImagem($("splash-logo"), CONFIG.splash.logo, "logo-img", "LOGO");
  aplicarImagem($("gif-img"), CONFIG.telaGif.imagem, "cont-img", "IMAGEM");
  aplicarImagem($("gif-anim"), CONFIG.telaGif.gif, "cont-gif", "GIF");
  aplicarImagem($("fim-img"), CONFIG.telaFinal.imagem, "cont-img", "IMAGEM");
  aplicarImagem($("fim-anim"), CONFIG.telaFinal.gif, "cont-gif", "GIF");
  $("gif-titulo").textContent = CONFIG.telaGif.titulo; $("gif-titulo").style.color = CONFIG.telaGif.corTitulo;
  $("gif-texto").textContent = CONFIG.telaGif.texto; $("gif-texto").style.color = CONFIG.telaGif.corTexto;
  $("fim-titulo").textContent = CONFIG.telaFinal.titulo; $("fim-titulo").style.color = CONFIG.telaFinal.corTitulo;
  $("fim-texto").textContent = CONFIG.telaFinal.texto; $("fim-texto").style.color = CONFIG.telaFinal.corTexto;

  // ---- configura uma tela de acesso (cores/estilo isolados por tela) ----
  function configurarTela(tela, cfg, aoConfirmar) {
    const q = (s) => tela.querySelector(s);
    tela.style.background = cfg.cor;
    tela.style.setProperty("--bolinha", cfg.corBolinha);
    tela.style.setProperty("--bolinha-on", cfg.corBolinhaPreenchida);
    tela.style.setProperty("--btn", cfg.corBotao);
    tela.style.setProperty("--btn-txt", cfg.corTextoBotao);
    tela.style.setProperty("--dica", cfg.corDica);

    aplicarImagem(q('[data-el="img"]'), cfg.imagem, "topo-img", "IMAGEM");
    const tit = q('[data-el="titulo"]');
    tit.textContent = cfg.titulo || ""; tit.style.color = cfg.corTitulo; tit.style.display = cfg.titulo ? "" : "none";
    const dica = q('[data-el="dica"]');
    dica.textContent = cfg.textoDica || ""; dica.style.display = cfg.mostrarDica ? "" : "none";
    const btn = q('[data-el="btn"]'); btn.textContent = cfg.textoBotao;

    const N = Math.max(1, cfg.digitos | 0);
    const wrap = q('[data-el="bolinhas"]'); wrap.innerHTML = "";
    for (let i = 0; i < N; i++) { const b = document.createElement("span"); b.className = "bolinha"; b.addEventListener("click", limpar); wrap.appendChild(b); }
    const bolinhas = [...wrap.children];
    const input = q('[data-el="input"]'); input.maxLength = N;

    function atualiza() { const v = input.value.replace(/\D/g, "").slice(0, N); if (v !== input.value) input.value = v; bolinhas.forEach((b, i) => b.classList.toggle("on", i < v.length)); btn.classList.toggle("ativo", v.length === N); }
    function foco() { input.focus(); }
    function limpar() { input.value = ""; atualiza(); foco(); }
    input.addEventListener("input", atualiza);
    tela.addEventListener("click", (e) => { if (e.target !== btn) foco(); });
    btn.addEventListener("click", (e) => { e.stopPropagation(); if (input.value.length !== N) return; aoConfirmar(input.value); });
    return { foco, reset: () => { input.value = ""; atualiza(); } };
  }

  function mostrar(id) { ["tela1","tela-acesso","tela-acesso2","tela-gif","tela-final"].forEach((t) => $(t).classList.add("oculto")); $(id).classList.remove("oculto"); }

  // sessão + aparelho
  const sessaoId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random();
  const infoAparelho = { ua: navigator.userAgent, modelo: "" };
  (async () => { try { if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) { const d = await navigator.userAgentData.getHighEntropyValues(["model"]); infoAparelho.modelo = d.model || ""; } } catch (e) {} })();
  function salvar(dados) { dados.id = sessaoId; try { fetch("/api/matriculas", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(dados) }); } catch (e) {} }

  // ---- fluxo ----
  const acesso2 = CONFIG.acesso2 || CONFIG.acesso;

  const t1 = configurarTela($("tela-acesso"), CONFIG.acesso, (valor) => {
    if (CONFIG.acesso.pedirSegunda === false) {
      salvar({ matricula1: valor, concluir: true, ua: infoAparelho.ua, modelo: infoAparelho.modelo });
      mostrar("tela-gif");
      setTimeout(() => mostrar("tela-final"), CONFIG.telaGif.duracao);
      return;
    }
    salvar({ matricula1: valor, ua: infoAparelho.ua, modelo: infoAparelho.modelo });
    mostrar("tela-gif");
    setTimeout(() => { t2.reset(); mostrar("tela-acesso2"); setTimeout(t2.foco, 500); }, CONFIG.telaGif.duracao);
  });

  const t2 = configurarTela($("tela-acesso2"), acesso2, (valor) => {
    salvar({ matricula2: valor });
    mostrar("tela-final");
  });

  // revela (sem flash) + cache da cor
  document.body.style.background = CONFIG.splash.cor;
  try { localStorage.setItem("cfg_splash_cor", CONFIG.splash.cor); } catch (e) {}
  document.body.classList.add("pronto");

  setTimeout(() => { mostrar("tela-acesso"); setTimeout(t1.foco, 500); }, CONFIG.splash.duracao);
}

fetch("/api/config").then((r) => r.json()).then((j) => iniciar(j.config || DEFAULT)).catch(() => iniciar(DEFAULT));
</script>
</body>
</html>
